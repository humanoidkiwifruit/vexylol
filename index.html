<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/favicons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/assets/favicons/favicon-16x16.png"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --50: #eff0fe;
                --100: #e1e2fe;
                --200: #c9cafc;
                --300: #a9a8f9;
                --400: #9085f4;
                --500: #7e68ec;
                --600: #6f4be0;
                --700: #5937b8;
                --800: #4f349f;
                --900: #42317e;
                --950: #281d49;
            }
            body {
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: var(--50);
            }
            .box {
                padding: 200px;
                background-color: var(--100);
                border: 5px solid var(--500);
                border-radius: 30px;
                color: var(--950);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-size: 30px;
                font-family: "Roboto";
            }

            #container {
                margin: 20px;
                padding: 20px;
                height: 100%;
                width: 100%;
                max-height: 100%;
                max-width: 100%;
                display: flex;
                justify-content: space-between;
                background-color: var(--50);
            }
            #left-sidebar {
                background-color: var(--100);
                font-family: "Roboto";
                float: left;
                width: 20vw;
                height: calc(100vh - 40px);
                border: 4px solid var(--900);
                border-radius: 20px;
                margin: 20px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }
            #main {
                background-color: var(--100);
                border: 4px solid var(--900);
                border-radius: 20px;
                height: calc(100vh - 40px);
                margin: 20px;
                width: 80vw;
            }
            #left-sidebar-container {
                background-color: green;
            }
            body {
                overflow: hidden;
            }
        </style>

        <title>vexy.lol</title>
    </head>
    <body>
        <div id="container">
            <div id="left-sidebar">
                <h2>Vexy.lol</h2>
                <p>A wonderful  website</p>
            </div>
            <div id="main"></div>
        </div>
    </body>
</html>
