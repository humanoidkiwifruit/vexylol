<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/favicons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/assets/favicons/favicon-16x16.png"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --50: #eff0fe;
                --100: #e1e2fe;
                --200: #c9cafc;
                --300: #a9a8f9;
                --400: #9085f4;
                --500: #7e68ec;
                --600: #6f4be0;
                --700: #5937b8;
                --800: #4f349f;
                --900: #42317e;
                --950: #281d49;
            }
            body {
                height: 100vh;
                width: 100%;
                display: flex;
                font-family: "Roboto";
                border-width: 0;
                margin: 0;
                border: 0;
                padding: 0;
            }
            #container {
                box-sizing: border-box;
                height: 100%;
                width: 100%;
                display: flex;
                background-color: var(--200);
                gap: 20px;
                padding: 20px;
            }
            #left-sidebar {
                background-color: var(--100);
                flex: 0 0 20%;
                border: 2px solid var(--900);
                border-radius: 20px;
                display: flex;
                flex-direction: column;
                text-align: center;
            }
            #right-main {
                background-color: var(--100);
                border: 2px solid var(--900);
                border-radius: 20px;
                flex: 1;
                display: flex;
                flex-direction: column;
                text-align: center;
            }
            #home-link-box {
                background-color: var(--300);
                border-radius: 15px;
                border: 2px solid var(--700);
                margin: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
            }
            #home-link-box:hover {
                background-color: var(--500);
            }
        </style>
        <title>vexy.lol</title>
    </head>
    <body>
        <div id="container">
            <div id="left-sidebar">
                <a href="/" style="color: inherit; text-decoration: none;"><div id="home-link-box"><h2 style="margin: 0;">Vexy.lol</h2></div></a>
                <p>A wonderful  website soon to be filled with flag-related shenanigans.</p>
            </div>
            <div id="right-main">
                <p>Content will go here.</p>
            </div>
        </div>
    </body>
</html>
